<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - SUNNO STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
      padding: 15px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      text-decoration: none;
      color: #475569;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: #00875a;
    }

    .cart-items-container {
      margin-bottom: 25px;
    }

    .cart-item {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }

    .cart-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 10px;
    }

    .item-details h4 {
      font-size: 13px;
      color: #0f172a;
      font-weight: 600;
    }

    .item-details p {
      font-size: 13px;
      font-weight: 700;
      color: #00875a;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .qty-btn {
      border: none;
      background: white;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #0f172a;
    }

    .checkout-form {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }

    .form-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      color: #0f172a;
      outline: none;
    }

    .place-order-btn {
      width: 100%;
      background: #00875a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    /* 💎 ULTRA-PREMIUM GLASS OVERLAY */
    .cart-runner-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cart-runner-overlay.active {
      opacity: 1; pointer-events: all;
    }

    .premium-loader-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 320px;
      width: 85%;
      border: 1px solid rgba(255, 255, 255, 0.5);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cart-runner-overlay.active .premium-loader-card {
      transform: scale(1);
    }

    .svg-cart-icon {
      width: 56px;
      height: 56px;
      color: #00875a;
      animation: bounceCart 1.2s ease-in-out infinite alternate;
    }

    @keyframes bounceCart {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-8deg) rotate(-3deg); }
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00875a, #10b981, #34d399);
      border-radius: 10px;
      position: absolute;
      left: -100%;
      animation: shimmerProgress 1.6s ease-in-out infinite;
    }

    @keyframes shimmerProgress {
      0% { left: -100%; }
      50% { left: 0%; }
      100% { left: 100%; }
    }

    .loader-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }

    .loader-subtext {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
      margin-top: -8px;
    }

    /* 🔔 TOAST POPUP */
    .toast-popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 13px;
      border: 1px solid #334155;
    }

    .toast-popup.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .toast-icon {
      background: #00875a;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- 💎 ULTRA-PREMIUM LOADER OVERLAY -->
  <div id="cartRunnerOverlay" class="cart-runner-overlay">
    <div class="premium-loader-card">
      <svg class="svg-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <div class="loader-title">SUNNO STORE</div>
      <div class="loader-subtext">Placing your order...</div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← Back to Shop</a>
    <div class="page-title">Your Cart</div>
  </div>

  <div class="cart-items-container" id="cartListContainer"></div>

  <div class="checkout-form">
    <div class="form-title">📋 Customer Information</div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="custName" placeholder="Enter your name">
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" id="custPhone" placeholder="Enter mobile number">
    </div>
    <div class="form-group">
      <label>Delivery Address</label>
      <input type="text" id="custAddress" placeholder="Enter full address">
    </div>
    
    <button class="place-order-btn" id="placeOrderBtn" onclick="processOrder()">Place Order</button>
  </div>

  <div id="toastPopup" class="toast-popup">
    <span class="toast-icon">🎉</span>
    <span id="toastMsg">Order Placed Successfully!</span>
  </div>

  <script>
    function loadCartItems() {
      const container = document.getElementById('cartListContainer');
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:20px; color:#64748b; font-size:13px;">Your cart is empty!</p>';
        return;
      }

      container.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <div class="cart-item-info">
            <img src="${item.image}" alt="${item.name}">
            <div class="item-details">
              <h4>${item.name}</h4>
              <p>SAR ${item.price}</p>
            </div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <span style="font-size:12px; font-weight:600;">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(index, amount) {
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];
      cart[index].qty += amount;
      
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }

      localStorage.setItem('sunno_cart', JSON.stringify(cart));
      loadCartItems();
    }

    function showToast(message) {
      const toast = document.getElementById('toastPopup');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;
      toast.classList.add('show');
    }

    function processOrder() {
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];

      if (cart.length === 0) {
        alert("আপনার কার্ট খালি!");
        return;
      }

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();

      if (!name || !phone) {
        alert("অনুগ্রহ করে আপনার নাম এবং মোবাইল নম্বর দিন!");
        return;
      }

      const overlay = document.getElementById('cartRunnerOverlay');
      const btn = document.getElementById('placeOrderBtn');

      btn.disabled = true;
      btn.innerText = "Processing Order...";

      if (overlay) overlay.classList.add('active');

      setTimeout(() => {
        if (overlay) overlay.classList.remove('active');
        localStorage.removeItem('sunno_cart');
        showToast("Order Placed Successfully!");

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);

      }, 1800);
    }

    document.addEventListener('DOMContentLoaded', loadCartItems);
  </script>

</body>
</html>
