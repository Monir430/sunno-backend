<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - SUNNO STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
      padding: 15px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      text-decoration: none;
      color: #475569;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: #00875a;
    }

    .cart-items-container {
      margin-bottom: 25px;
    }

    .cart-item {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }

    .cart-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 10px;
    }

    .item-details h4 {
      font-size: 13px;
      color: #0f172a;
      font-weight: 600;
    }

    .item-details p {
      font-size: 13px;
      font-weight: 700;
      color: #00875a;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .qty-btn {
      border: none;
      background: white;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #0f172a;
    }

    .checkout-form {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }

    .form-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      color: #0f172a;
      outline: none;
    }

    .place-order-btn {
      width: 100%;
      background: #00875a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ✨ PREMIUM GLASS LOADER OVERLAY */
    .cart-runner-overlay {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; 
      justify-content: center; 
      align-items: center;
      z-index: 9999;
      opacity: 0; 
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .cart-runner-overlay.active {
      opacity: 1; 
      pointer-events: all;
    }

    .walking-card {
      background: #ffffff;
      padding: 30px 20px 20px 20px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      width: 88%;
      max-width: 320px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .walking-track-container {
      width: 100%;
      height: 70px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .sunno-track-text {
      font-size: 32px;
      font-weight: 900;
      color: #00875a;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.2;
      margin-bottom: 2px;
      user-select: none;
    }

    .walker-wrapper {
      position: absolute;
      bottom: 0;
      left: -40px;
      width: 35px;
      height: 50px;
    }

    .cart-runner-overlay.active .walker-wrapper {
      animation: moveAcross 2.2s linear infinite;
    }

    @keyframes moveAcross {
      0% { left: -40px; }
      100% { left: 100%; }
    }

    .cart-runner-overlay.active .leg-left {
      animation: legWalk 0.6s ease-in-out infinite alternate;
      transform-origin: 18px 30px;
    }
    .cart-runner-overlay.active .leg-right {
      animation: legWalk 0.6s ease-in-out infinite alternate-reverse;
      transform-origin: 18px 30px;
    }
    .cart-runner-overlay.active .arm-bag {
      animation: armSwing 0.6s ease-in-out infinite alternate;
      transform-origin: 20px 16px;
    }

    @keyframes legWalk {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }

    @keyframes armSwing {
      0% { transform: rotate(15deg); }
      100% { transform: rotate(-15deg); }
    }

    .loader-status-text {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      letter-spacing: 0.5px;
    }

    /* 🔔 TOAST POPUP */
    .toast-popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 13px;
      border: 1px solid #334155;
    }

    .toast-popup.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .toast-icon {
      background: #00875a;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- ✨ REALISTIC WALKING OVERLAY -->
  <div id="cartRunnerOverlay" class="cart-runner-overlay">
    <div class="walking-card">
      <div class="walking-track-container">
        
        <div class="walker-wrapper">
          <svg viewBox="0 0 40 60" width="35" height="50">
            <circle cx="20" cy="8" r="5" fill="#00875a" />
            <line x1="20" y1="13" x2="18" y2="30" stroke="#00875a" stroke-width="3.5" stroke-linecap="round" />
            <line class="leg-left" x1="18" y1="30" x2="10" y2="48" stroke="#00875a" stroke-width="3" stroke-linecap="round" />
            <line class="leg-right" x1="18" y1="30" x2="26" y2="48" stroke="#00875a" stroke-width="3" stroke-linecap="round" />
            <line x1="20" y1="16" x2="12" y2="26" stroke="#00875a" stroke-width="2.5" stroke-linecap="round" />
            <g class="arm-bag">
              <line x1="20" y1="16" x2="27" y2="27" stroke="#00875a" stroke-width="2.5" stroke-linecap="round" />
              <rect x="23" y="27" width="9" height="11" rx="2" fill="#00875a" />
              <path d="M25 27 C25 24, 30 24, 30 27" fill="none" stroke="#00875a" stroke-width="1.2" />
            </g>
          </svg>
        </div>

        <div class="sunno-track-text">SUNNO</div>
      </div>

      <div class="loader-status-text">Processing Request...</div>
    </div>
  </div>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← Back to Shop</a>
    <div class="page-title">Your Cart</div>
  </div>

  <div class="cart-items-container" id="cartListContainer"></div>

  <div class="checkout-form">
    <div class="form-title">📋 Customer Information</div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="custName" placeholder="Enter your name">
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" id="custPhone" placeholder="Enter mobile number">
    </div>
    <div class="form-group">
      <label>Delivery Address</label>
      <input type="text" id="custAddress" placeholder="Enter full address">
    </div>
    
    <button class="place-order-btn" id="placeOrderBtn" onclick="processOrder()">Place Order</button>
  </div>

  <div id="toastPopup" class="toast-popup">
    <span class="toast-icon">🎉</span>
    <span id="toastMsg">Order Placed Successfully!</span>
  </div>

  <script>
    function loadCartItems() {
      const container = document.getElementById('cartListContainer');
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:20px; color:#64748b; font-size:13px;">Your cart is empty!</p>';
        return;
      }

      container.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <div class="cart-item-info">
            <img src="${item.image}" alt="${item.name}">
            <div class="item-details">
              <h4>${item.name}</h4>
              <p>SAR ${item.price}</p>
            </div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <span style="font-size:12px; font-weight:600;">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(index, amount) {
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];
      cart[index].qty += amount;
      
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }

      localStorage.setItem('sunno_cart', JSON.stringify(cart));
      loadCartItems();
    }

    function showToast(message) {
      const toast = document.getElementById('toastPopup');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;
      toast.classList.add('show');
    }

    function processOrder() {
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];

      if (cart.length === 0) {
        alert("আপনার কার্ট খালি!");
        return;
      }

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();

      if (!name || !phone) {
        alert("অনুগ্রহ করে আপনার নাম এবং মোবাইল নম্বর দিন!");
        return;
      }

      const overlay = document.getElementById('cartRunnerOverlay');
      const btn = document.getElementById('placeOrderBtn');

      btn.disabled = true;
      btn.innerText = "Processing Order...";

      if (overlay) overlay.classList.add('active');

      setTimeout(() => {
        if (overlay) overlay.classList.remove('active');
        localStorage.removeItem('sunno_cart');
        showToast("Order Placed Successfully!");

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);

      }, 1800);
    }

    document.addEventListener('DOMContentLoaded', loadCartItems);
  </script>

</body>
</html>
