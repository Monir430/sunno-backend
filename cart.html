<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Sunno Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:#f8f9fa; color:#333; padding:15px; max-width:600px; margin:0 auto; }
    
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
    .back-btn { background:#e2e8f0; color:#334155; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; text-decoration:none; }
    
    .cart-card { background:#fff; border-radius:10px; padding:15px; border:1px solid #edf2f7; margin-bottom:15px; }
    .cart-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f1f5f9; }
    .cart-item img { width:50px; height:50px; object-fit:contain; border-radius:6px; }
    .item-details { flex:1; }
    .item-title { font-size:13px; font-weight:600; color:#1e293b; }
    .item-price { font-size:12px; color:#00875a; font-weight:700; }
    
    .qty-controls { display:flex; align-items:center; gap:8px; }
    .qty-btn { background:#f1f5f9; border:1px solid #cbd5e1; width:24px; height:24px; border-radius:4px; font-weight:bold; cursor:pointer; }
    
    .checkout-box { background:#fff; padding:15px; border-radius:10px; border:1px solid #edf2f7; }
    .input-group { margin-bottom:10px; }
    .input-group label { display:block; font-size:11px; font-weight:600; color:#64748b; margin-bottom:3px; }
    .input-group input { width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px; outline:none; }
    .input-group input:focus { border-color:#00875a; }
    
    .total-box { display:flex; justify-content:space-between; font-size:15px; font-weight:700; margin:15px 0; color:#0f172a; }
    .submit-btn { background:#00875a; color:#fff; border:none; width:100%; padding:12px; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer; }
    .submit-btn:disabled { background:#cbd5e1; cursor:not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn">⬅ Back to Shop</a>
    <h3 style="font-size:16px; color:#00875a;">🛒 Your Cart</h3>
  </div>

  <!-- Cart List Container -->
  <div class="cart-card" id="cartContainer">
    <p style="text-align:center; color:#64748b; font-size:13px;">Loading cart...</p>
  </div>

  <!-- Checkout Details Form -->
  <div class="checkout-box">
    <h4 style="font-size:14px; margin-bottom:10px; color:#1e293b;">📋 Customer Information</h4>
    
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="custName" placeholder="Enter your name">
    </div>

    <div class="input-group">
      <label>Mobile Number</label>
      <input type="tel" id="custPhone" placeholder="Enter phone number">
    </div>

    <div class="input-group">
      <label>Delivery Address</label>
      <input type="text" id="custAddress" placeholder="Street name, House/Apartment no." required>
    </div>

    <div class="total-box">
      <span>Total Bill:</span>
      <span>SAR <span id="totalBill">0.00</span></span>
    </div>

    <button class="submit-btn" id="placeOrderBtn" onclick="placeOrder()">Place Order Now</button>
  </div>

  <script>
    const API_URL = 'https://sunno-backend.onrender.com';
    let cart = [];

    // ১. কার্ট ডাটা লোড ও ইউজারের ডাটা অটো-ফিল করা
    function initCart() {
      cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];
      const user = JSON.parse(localStorage.getItem('sunno_user'));

      // ইউজার লগইন থাকলে নাম ও ফোন নম্বর বক্স-এ নিজে থেকে বসে যাবে
      if (user) {
        if (user.name) document.getElementById('custName').value = user.name;
        if (user.phone) document.getElementById('custPhone').value = user.phone;
      }

      renderCartUI();
    }

    // ২. কার্ট রেন্ডার
    function renderCartUI() {
      const container = document.getElementById('cartContainer');
      
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:13px; padding:10px;">Your cart is empty.</p>';
        document.getElementById('totalBill').innerText = '0.00';
        document.getElementById('placeOrderBtn').disabled = true;
        return;
      }

      document.getElementById('placeOrderBtn').disabled = false;
      let total = 0;

      container.innerHTML = cart.map((item, index) => {
        total += item.price * item.qty;
        return `
          <div class="cart-item">
            <img src="${item.image || 'https://via.placeholder.com/50'}" alt="${item.name}">
            <div class="item-details">
              <div class="item-title">${item.name}</div>
              <div class="item-price">SAR ${item.price}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
              <span style="font-size:12px; font-weight:600;">${item.qty}</span>
              <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('totalBill').innerText = total.toFixed(2);
    }

    // ৩. পরিমাণ কমানো/বাড়ানো
    function updateQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      localStorage.setItem('sunno_cart', JSON.stringify(cart));
      renderCartUI();
    }

    // ৪. অর্ডার প্লেস করা (Checkout)
    async function placeOrder() {
      if (cart.length === 0) {
        alert('Cart is empty!');
        return;
      }

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if (!name || !phone || !address) {
        alert('❌ Please fill in your Name, Phone Number, and Delivery Address!');
        return;
      }

      const btn = document.getElementById('placeOrderBtn');
      btn.innerText = 'Processing Order...';
      btn.disabled = true;

      const totalAmount = parseFloat(document.getElementById('totalBill').innerText);

      try {
        const response = await fetch(`${API_URL}/api/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName: name,
            phone: phone,
            address: address,
            items: cart,
            totalAmount: totalAmount
          })
        });

        if (response.ok) {
          alert('🎉 Order Placed Successfully!');
          localStorage.removeItem('sunno_cart'); // কার্ট খালি করা
          window.location.href = 'index.html'; // হোমপেজে ফেরত
        } else {
          alert('❌ Failed to place order. Try again!');
          btn.innerText = 'Place Order Now';
          btn.disabled = false;
        }
      } catch (err) {
        alert('❌ Network Error! Could not connect to backend.');
        btn.innerText = 'Place Order Now';
        btn.disabled = false;
      }
    }

    // পেজ লোড হলে কল হবে
    initCart();
  </script>
</body>
</html>
