<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunno Store - Live Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:#f4f6f8; padding:15px; }
    header { background:#1a252f; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-radius:10px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:15px; }
    .card { background:white; padding:12px; border-radius:10px; border:1px solid #ddd; text-align:center; }
    .card img { width:100%; height:110px; object-fit:contain; }
    .btn { background:#28a745; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; margin-top:10px; font-weight:600; width:100%; }
    .cart-box { background:white; padding:15px; border-radius:10px; margin-top:25px; border:1px solid #ddd; }
    input { width:100%; padding:10px; margin:5px 0 12px; border:1px solid #ccc; border-radius:5px; }
  </style>
</head>
<body>

  <header>
    <h2>🛒 SUNNO STORE</h2>
    <div>Cart: <b id="cartCount">0</b></div>
  </header>

  <h3>Products</h3>
  <br>
  <div class="grid" id="productContainer">Loading products...</div>

  <div class="cart-box">
    <h3>Order & Checkout</h3>
    <div id="cartList" style="margin:10px 0;">Cart is empty.</div>
    <h4>Total: SAR <span id="totalBill">0.00</span></h4>
    
    <hr style="margin:15px 0;">
    <h4>Customer Info:</h4>
    <input type="text" id="custName" placeholder="Your Full Name">
    <input type="text" id="custPhone" placeholder="Mobile Number">
    <input type="text" id="custAddress" placeholder="Delivery Address">
    
    <button class="btn" style="padding:12px; font-size:16px;" onclick="submitOrder()">Place Order</button>
  </div>

  <script>
    const API_URL = 'https://sunno-backend.onrender.com';
    let cart = [];

    async function fetchProducts() {
      const container = document.getElementById('productContainer');
      let products = null;

      try {
        // ১ম চেষ্টা: /api/products রাউটে
        let res = await fetch(`${API_URL}/api/products`);
        if (res.ok) {
          products = await res.json();
        } else {
          // ২য় চেষ্টা: /products রাউটে
          res = await fetch(`${API_URL}/products`);
          if (res.ok) products = await res.json();
        }

        if (!products || products.length === 0) {
          container.innerHTML = '<p style="grid-column: 1/-1;">No products available right now. Please add from Admin panel.</p>';
          return;
        }

        container.innerHTML = products.map(p => `
          <div class="card">
            <img src="${p.image || 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300'}" alt="${p.name}">
            <h4 style="margin-top:5px;">${p.name}</h4>
            <p style="color:#28a745; font-weight:bold;">SAR ${p.price}</p>
            <small>Stock: ${p.stock || 0}</small>
            <button class="btn" onclick="addToCart('${p._id}', '${p.name}', ${p.price})">Add to Cart</button>
          </div>
        `).join('');

      } catch(err) {
        container.innerHTML = '<p style="color:red; grid-column: 1/-1;">Server woke up late or Connection Error. Please refresh in 30 seconds.</p>';
      }
    }

    function addToCart(id, name, price) {
      const item = cart.find(i => i.id === id);
      if(item) item.qty++;
      else cart.push({ id, name, price, qty: 1 });
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
      let total = 0;
      const list = document.getElementById('cartList');
      
      if(cart.length === 0) {
        list.innerHTML = 'Cart is empty.';
      } else {
        list.innerHTML = cart.map(i => {
          total += i.price * i.qty;
          return `<div><b>${i.name}</b> x ${i.qty} - SAR ${(i.price * i.qty).toFixed(2)}</div>`;
        }).join('');
      }
      document.getElementById('totalBill').innerText = total.toFixed(2);
    }

    async function submitOrder() {
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;

      if(!name || !phone || cart.length === 0) {
        alert('Please fill out name, phone and add items to cart!');
        return;
      }

      const totalAmount = parseFloat(document.getElementById('totalBill').innerText);
      const payload = { customerName: name, phone, address, items: cart, totalAmount };

      try {
        let res = await fetch(`${API_URL}/api/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if(!res.ok) {
          res = await fetch(`${API_URL}/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        if(res.ok) {
          alert('🎉 Order Placed Successfully!');
          cart = [];
          document.getElementById('custName').value = '';
          document.getElementById('custPhone').value = '';
          document.getElementById('custAddress').value = '';
          updateCartUI();
          fetchProducts();
        } else {
          alert('Failed to place order.');
        }
      } catch(err) {
        alert('Network or Server Error.');
      }
    }

    fetchProducts();
  </script>
</body>
</html>
