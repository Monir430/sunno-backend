<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunno Store - Online Grocery</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body { background:#f8f9fa; color:#333; padding-bottom:80px; }
    
    header { background:#fff; padding:12px 15px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .nav-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .logo { font-size:18px; font-weight:700; color:#00875a; display:flex; align-items:center; gap:5px; }
    
    .header-actions { display:flex; gap:8px; align-items:center; }
    .login-btn { background:#f1f5f9; color:#334155; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:4px; border:1px solid #cbd5e1; }
    .cart-btn { background:#00875a; color:#fff; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; }
    .cart-badge { background:#fff; color:#00875a; border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold; }
    
    .search-box { position:relative; width:100%; }
    .search-box input { width:100%; padding:10px 12px 10px 35px; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; background:#f1f5f9; outline:none; }
    .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:14px; color:#94a3b8; }
    
    /* Category Scroll */
    .cat-scroll { display:flex; gap:8px; padding:12px 15px; overflow-x:auto; white-space:nowrap; background:#fff; margin-bottom:12px; border-bottom:1px solid #edf2f7; }
    .cat-scroll::-webkit-scrollbar { display:none; }
    .cat-pill { padding:6px 14px; background:#f1f5f9; border-radius:20px; font-size:12px; font-weight:500; color:#475569; cursor:pointer; }
    .cat-pill.active { background:#00875a; color:#fff; font-weight:600; }
    
    .main-container { padding:0 15px; }
    
    /* Track Box */
    .track-box { background:#fff; padding:12px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:15px; }
    
    /* Product Grid */
    .product-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:10px; }
    @media (min-width: 600px) { .product-grid { grid-template-columns:repeat(4, 1fr); } }
    
    .p-card { background:#fff; border-radius:10px; padding:10px; border:1px solid #edf2f7; display:flex; flex-direction:column; justify-content:space-between; text-align:center; position:relative; }
    .p-card img { width:100%; height:110px; object-fit:contain; margin-bottom:8px; }
    .p-title { font-size:12px; font-weight:600; color:#1e293b; line-height:1.3; height:32px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .p-price { font-size:13px; font-weight:700; color:#00875a; margin:5px 0; }
    .add-btn { background:#00875a; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer; width:100%; transition:0.2s; }
    .add-btn:active { transform:scale(0.96); }
  </style>
</head>
<body>

  <header>
    <div class="nav-top">
      <div class="logo">🛒 SUNNO STORE</div>
      
      <div class="header-actions">
        <!-- Login Button -->
        <div class="login-btn" id="userAccountBtn" onclick="window.location.href='login.html'">
          👤 Login
        </div>
        
        <!-- Cart Button -->
        <div class="cart-btn" onclick="window.location.href='cart.html'">
          🛒 Cart <span class="cart-badge" id="cartCount">0</span>
        </div>
      </div>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search products...">
    </div>
  </header>

  <!-- Categories -->
  <div class="cat-scroll" id="categoryContainer">
    <div class="cat-pill active" onclick="filterCategory('All', this)">All</div>
  </div>

  <div class="main-container">
    
    <!-- Order Track Box -->
    <div class="track-box">
      <h4 style="color:#0369a1; font-size:13px; margin-bottom:6px;">📍 Track Your Order Status</h4>
      <div style="display:flex; gap:8px;">
        <input type="text" id="trackPhone" placeholder="Enter Mobile Number" style="flex:1; padding:8px; border-radius:6px; border:1px solid #93c5fd; outline:none; font-size:12px;">
        <button onclick="trackOrder()" style="background:#0284c7; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:600; font-size:12px;">Check</button>
      </div>
      <div id="trackResult" style="margin-top:8px; font-size:12px;"></div>
    </div>

    <!-- Products List Header -->
    <h3 style="color:#1e293b; font-size:15px; margin-top:10px;">Featured Products</h3>
    <div class="product-grid" id="productContainer">Loading products...</div>

  </div>

  <script>
    const API_URL = 'https://sunno-backend.onrender.com';
    let allProducts = [];

    // ১. ডাটাবেস থেকে প্রোডাক্ট লোড করা
    async function fetchProducts() {
      try {
        const res = await fetch(`${API_URL}/api/products`);
        if (res.ok) {
          allProducts = await res.json();
          renderCategories();
          renderProducts(allProducts);
        } else {
          document.getElementById('productContainer').innerHTML = '<p style="grid-column:1/-1; text-align:center;">Failed to load products.</p>';
        }
      } catch (err) {
        document.getElementById('productContainer').innerHTML = '<p style="grid-column:1/-1; text-align:center;">Connecting to server...</p>';
      }
    }

    // ২. ক্যাটাগরি ফিল্টার রেন্ডার
    function renderCategories() {
      const categories = ['All', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map((c, i) => `
        <div class="cat-pill ${i===0?'active':''}" onclick="filterCategory('${c}', this)">${c}</div>
      `).join('');
    }

    // ৩. গ্রিডে প্রোডাক্ট রেন্ডার
    function renderProducts(list) {
      const container = document.getElementById('productContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<p style="grid-column:1/-1; color:#64748b; text-align:center; padding:20px;">No products found.</p>';
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="p-card">
          <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}">
          <div>
            <div class="p-title">${p.name}</div>
            <div class="p-price">SAR ${p.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, '${p.image || ''}')">+ Add</button>
        </div>
      `).join('');
    }

    // ৪. ক্যাটাগরি অনুযায়ী ফিল্টার
    function filterCategory(cat, el) {
      if (el) {
        document.querySelectorAll('.cat-pill').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
      }
      if (cat === 'All') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    // ৫. সার্চ ফিল্টার
    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(q)));
    }

    // ৬. কার্টে প্রোডাক্ট যোগ করা (LocalStorage-এ)
    function addToCart(id, name, price, image) {
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty++;
      } else {
        cart.push({ id, name, price, image, qty: 1 });
      }
      localStorage.setItem('sunno_cart', JSON.stringify(cart));
      updateCartCount();
      
      const btn = event.target;
      const oldText = btn.innerText;
      btn.innerText = '✓ Added';
      btn.style.background = '#059669';
      setTimeout(() => {
        btn.innerText = oldText;
        btn.style.background = '#00875a';
      }, 1000);
    }

    // ৭. কার্ট আইকনের সংখ্যা আপডেট করা
    function updateCartCount() {
      let cart = JSON.parse(localStorage.getItem('sunno_cart')) || [];
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const cartCountEl = document.getElementById('cartCount');
      if (cartCountEl) cartCountEl.innerText = totalCount;
    }

    // ৮. ইউজার লগইন অবস্থা চেক করা
    function checkUserLogin() {
      const user = JSON.parse(localStorage.getItem('sunno_user'));
      const accountBtn = document.getElementById('userAccountBtn');
      if (user && user.name && accountBtn) {
        accountBtn.innerText = `👤 ${user.name}`;
      }
    }

    // ৯. অর্ডার ট্র্যাকিং
    async function trackOrder() {
      const phone = document.getElementById('trackPhone').value;
      const resEl = document.getElementById('trackResult');
      if(!phone) { alert('Enter phone number!'); return; }

      resEl.innerHTML = 'Searching...';
      try {
        const res = await fetch(`${API_URL}/api/orders/track/${phone}`);
        const orders = await res.json();
        if(orders.length === 0) {
          resEl.innerHTML = '<span style="color:#ef4444;">No orders found with this number.</span>';
        } else {
          resEl.innerHTML = orders.map(o => `
            <div style="background:#f0f9ff; padding:8px; border-radius:6px; margin-top:5px; border:1px solid #bae6fd;">
              <b>Order #${o._id.slice(-6)}</b> - Status: <span style="color:#0284c7; font-weight:bold;">${o.status}</span><br>
              <small>Total: SAR ${o.totalAmount}</small>
            </div>
          `).join('');
        }
      } catch(err) { resEl.innerHTML = '<span style="color:#ef4444;">Error fetching status.</span>'; }
    }

    // পেজ লোড হলে রান হবে
    fetchProducts();
    updateCartCount();
    checkUserLogin();
  </script>
</body>
</html>
