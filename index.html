<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunno Store - Online Superstore</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f8f9fa; color: #333; padding-bottom: 30px; }

    header {
      background: #ffffff; padding: 12px 16px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .nav-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .logo { font-size: 20px; font-weight: 700; color: #00875a; }
    .search-box { margin-top: 10px; position: relative; }
    .search-box input {
      width: 100%; padding: 10px 14px 10px 38px; border: 1px solid #e2e8f0;
      border-radius: 20px; background: #f1f5f9; font-size: 14px; outline: none;
    }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }
    .cart-btn {
      background: #e8f5e9; color: #00875a; padding: 8px 14px; border-radius: 20px;
      font-weight: 600; font-size: 14px; cursor: pointer;
    }

    .cat-scroll {
      display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px;
      background: #fff; border-bottom: 1px solid #edf2f7; scrollbar-width: none;
    }
    .cat-pill {
      background: #f1f5f9; padding: 6px 16px; border-radius: 16px;
      white-space: nowrap; font-size: 13px; font-weight: 500; color: #475569; cursor: pointer;
    }
    .cat-pill.active { background: #00875a; color: white; }

    .main-container { padding: 16px; max-width: 800px; margin: 0 auto; }

    .track-box {
      background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 12px; padding: 14px; margin-bottom: 20px;
    }

    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
    .p-card {
      background: #fff; border-radius: 14px; padding: 12px; border: 1px solid #f1f5f9;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .p-card img { width: 100%; height: 110px; object-fit: contain; margin-bottom: 8px; }
    .p-title { font-size: 13px; font-weight: 600; color: #1e293b; height: 36px; overflow: hidden; }
    .p-price { font-size: 15px; font-weight: 700; color: #00875a; margin: 6px 0; }
    .add-btn { background: #00875a; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }

    .cart-box { background: white; padding: 18px; border-radius: 16px; margin-top: 30px; border: 1px solid #e2e8f0; }
    .cart-box input { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .submit-btn { background: #00875a; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="nav-top">
      <div class="logo">🛒 SUNNO STORE</div>
      <div class="cart-btn" onclick="document.getElementById('checkoutSection').scrollIntoView({behavior:'smooth'})">
        🛒 Cart: <b id="cartCount">0</b>
      </div>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search products...">
    </div>
  </header>

  <!-- Auto Dynamic Categories -->
  <div class="cat-scroll" id="categoryContainer">
    <div class="cat-pill active" onclick="filterCategory('All')">All</div>
  </div>

  <div class="main-container">

    <!-- Order Track Box -->
    <div class="track-box">
      <h4 style="color:#0369a1; margin-bottom:6px;">📍 Track Your Order Status</h4>
      <div style="display:flex; gap:8px;">
        <input type="text" id="trackPhone" placeholder="Enter Mobile Number" style="flex:1; padding:8px; border-radius:6px; border:1px solid #93c5fd; outline:none;">
        <button onclick="trackOrder()" style="background:#0284c7; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:600;">Check</button>
      </div>
      <div id="trackResult" style="margin-top:10px; font-size:13px;"></div>
    </div>

    <!-- Products List -->
    <h3 style="color:#1e293b;">Featured Products</h3>
    <div class="product-grid" id="productContainer">Loading products...</div>

    <!-- Cart Box -->
    <div class="cart-box" id="checkoutSection">
      <h3>🛒 Checkout</h3>
      <div id="cartList" style="margin:10px 0; color:#64748b;">Cart is empty.</div>
      <h4 style="color:#00875a; margin-bottom:12px;">Total: SAR <span id="totalBill">0.00</span></h4>
      
      <input type="text" id="custName" placeholder="Your Full Name">
      <input type="text" id="custPhone" placeholder="Mobile Number">
      <input type="text" id="custAddress" placeholder="Delivery Address">
      
      <button class="submit-btn" onclick="submitOrder()">Place Order Now</button>
    </div>

  </div>

  <script>
    const API_URL = 'https://sunno-backend.onrender.com';
    let allProducts = [];
    let cart = [];

    async function fetchProducts() {
      try {
        const res = await fetch(`${API_URL}/api/products`);
        if (res.ok) {
          allProducts = await res.json();
          renderCategories();
          renderProducts(allProducts);
        }
      } catch(err) {
        document.getElementById('productContainer').innerHTML = 'Connecting to server...';
      }
    }

    function renderCategories() {
      const categories = ['All', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map((c, i) => `
        <div class="cat-pill ${i===0?'active':''}" onclick="filterCategory('${c}', this)">${c}</div>
      `).join('');
    }

    function renderProducts(list) {
      const container = document.getElementById('productContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1;">No products found.</p>';
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="p-card">
          <img src="${p.image || 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300'}" alt="${p.name}">
          <div class="p-title">${p.name}</div>
          <div class="p-price">SAR ${p.price}</div>
          <button class="add-btn" onclick="addToCart('${p._id}', '${p.name}', ${p.price})">+ Add</button>
        </div>
      `).join('');
    }

    function filterCategory(cat, el) {
      if(el) {
        document.querySelectorAll('.cat-pill').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
      }

      if (cat === 'All') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(q)));
    }

    function addToCart(id, name, price) {
      const item = cart.find(i => i.id === id);
      if(item) item.qty++;
      else cart.push({ id, name, price, qty: 1 });
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
      let total = 0;
      const list = document.getElementById('cartList');
      
      if(cart.length === 0) {
        list.innerHTML = 'Cart is empty.';
      } else {
        list.innerHTML = cart.map(i => {
          total += i.price * i.qty;
          return `<div><b>${i.name}</b> x ${i.qty} - SAR ${(i.price * i.qty).toFixed(2)}</div>`;
        }).join('');
      }
      document.getElementById('totalBill').innerText = total.toFixed(2);
    }

    async function trackOrder() {
      const phone = document.getElementById('trackPhone').value;
      const resDiv = document.getElementById('trackResult');
      if(!phone) { alert('Please enter phone number'); return; }

      resDiv.innerHTML = 'Searching...';
      try {
        const res = await fetch(`${API_URL}/api/orders/track/${phone}`);
        const orders = await res.json();
        
        if(!orders || orders.length === 0) {
          resDiv.innerHTML = '<b style="color:red;">No orders found for this number.</b>';
          return;
        }

        resDiv.innerHTML = orders.map(o => `
          <div style="background:white; padding:8px; border-radius:6px; margin-top:6px; border:1px solid #cbd5e1;">
            <div><b>Order ID:</b> #${o._id.slice(-6)}</div>
            <div><b>Status:</b> <span style="color:#0284c7; font-weight:bold;">${o.status}</span></div>
            <div><b>Total:</b> SAR ${o.totalAmount}</div>
          </div>
        `).join('');
      } catch(err) { resDiv.innerHTML = 'Error tracking order.'; }
    }

    async function submitOrder() {
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;

      if(!name || !phone || cart.length === 0) {
        alert('Please fill out Name, Phone and Add Items!');
        return;
      }

      const totalAmount = parseFloat(document.getElementById('totalBill').innerText);

      try {
        const res = await fetch(`${API_URL}/api/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customerName: name, phone, address, items: cart, totalAmount })
        });

        if(res.ok) {
          alert('🎉 Order Placed Successfully!');
          cart = [];
          document.getElementById('custName').value = '';
          document.getElementById('custPhone').value = '';
          document.getElementById('custAddress').value = '';
          updateCartUI();
        }
      } catch(err) { alert('Error placing order.'); }
    }

    fetchProducts();
  </script>
</body>
</html>
